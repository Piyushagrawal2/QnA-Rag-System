# ==================================================
# RAG Q&A System - CD Pipeline (ECR + App Runner)
# ==================================================

name: CD - Deploy to AWS (ECR + App Runner)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rag-qa-project
  APP_RUNNER_SERVICE: rag-qa-project

# ==================================================
# JOB 1: Build & Push Docker Image to ECR
# ==================================================
jobs:
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.set-image-uri.outputs.image_uri }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 🔐 Correct AWS authentication (NO STS, NO SESSION TOKEN)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushing Docker image..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Set image URI output
        id: set-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $IMAGE_URI"

# ==================================================
# JOB 2: Deploy to AWS App Runner
# ==================================================
  deploy:
    name: Deploy to AWS App Runner
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 🔐 Correct AWS authentication (NO STS)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # --------------------------------------------------
      # Check if App Runner service already exists
      # --------------------------------------------------
      - name: Check App Runner service
        id: check-service
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --region $AWS_REGION \
            --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" \
            --output text)

          if [ -z "$SERVICE_ARN" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service does not exist"
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
            echo "Service exists: $SERVICE_ARN"
          fi

      # --------------------------------------------------
      # Create App Runner config file (SAFE JSON)
      # --------------------------------------------------
      - name: Create App Runner source config
        run: |
          cat <<EOF > apprunner-source.json
          {
            "ImageRepository": {
              "ImageIdentifier": "${{ needs.build-and-push.outputs.image_uri }}",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000",
                "RuntimeEnvironmentVariables": {
                  "ENV": "production",
                  "LOG_LEVEL": "INFO",
                  "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}",
                  "QDRANT_URL": "${{ secrets.QDRANT_URL }}",
                  "QDRANT_API_KEY": "${{ secrets.QDRANT_API_KEY }}",
                  "LANGSMITH_TRACING": "true",
                  "LANGSMITH_API_KEY": "${{ secrets.LANGSMITH_API_KEY }}",
                  "LANGSMITH_PROJECT": "rag-qa-production-system",
                  "LANGSMITH_ENDPOINT": "https://eu.api.smith.langchain.com"
                }
              }
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ACCESS_ROLE_ARN }}"
            },
            "AutoDeploymentsEnabled": false
          }
          EOF

      # --------------------------------------------------
      # Create App Runner service
      # --------------------------------------------------
      - name: Create App Runner service
        if: steps.check-service.outputs.exists == 'false'
        id: create-service
        run: |
          aws apprunner create-service \
            --service-name $APP_RUNNER_SERVICE \
            --region $AWS_REGION \
            --source-configuration file://apprunner-source.json \
            --instance-configuration Cpu=1vCPU,Memory=2GB \
            --health-check-configuration Protocol=HTTP,Path=/health \
            --output json > service.json

          SERVICE_ARN=$(jq -r '.Service.ServiceArn' service.json)
          SERVICE_URL=$(jq -r '.Service.ServiceUrl' service.json)

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # Update App Runner service
      # --------------------------------------------------
      - name: Update App Runner service
        if: steps.check-service.outputs.exists == 'true'
        id: update-service
        run: |
          aws apprunner update-service \
            --service-arn ${{ steps.check-service.outputs.service_arn }} \
            --source-configuration file://apprunner-source.json \
            --output json > service.json

          SERVICE_ARN=$(jq -r '.Service.ServiceArn' service.json)
          SERVICE_URL=$(jq -r '.Service.ServiceUrl' service.json)

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # Wait until service is RUNNING
      # --------------------------------------------------
      - name: Wait for App Runner to be ready
        run: |
          SERVICE_ARN="${{ steps.create-service.outputs.service_arn || steps.update-service.outputs.service_arn }}"

          echo "Waiting for App Runner service: $SERVICE_ARN"

          for i in {1..60}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn $SERVICE_ARN \
              --query 'Service.Status' \
              --output text)

            echo "Status: $STATUS ($i/60)"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "✅ Service is running"
              exit 0
            fi

            if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
              echo "❌ Deployment failed"
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timeout waiting for App Runner"
          exit 1

      # --------------------------------------------------
      # Final Output
      # --------------------------------------------------
      - name: Output Service URL
        run: |
          SERVICE_URL="${{ steps.create-service.outputs.service_url || steps.update-service.outputs.service_url }}"
          echo "🚀 Deployment successful!"
          echo "App Runner URL: https://$SERVICE_URL"
